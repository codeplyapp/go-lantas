<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="policeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="goldBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="visorGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle Glow -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.6"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#1e40af" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Robot Head Base / Helmet -->
  <path d="M 50 105 C 50 65 72 45 100 45 C 128 45 150 65 150 105 C 150 135 135 152 100 152 C 65 152 50 135 50 105 Z" fill="url(#policeBlue)" stroke="#60a5fa" stroke-width="2.5"/>

  <!-- Police Cap Visor / Top Shield -->
  <path d="M 60 62 C 75 48 125 48 140 62 C 145 66 135 72 100 72 C 65 72 55 66 60 62 Z" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
  
  <!-- Korlantas / Polri Gold Star Emblem -->
  <polygon points="100,50 103,58 111,58 105,63 107,71 100,66 93,71 95,63 89,58 97,58" fill="url(#goldBadge)" stroke="#fef08a" stroke-width="0.5" filter="url(#glow)"/>

  <!-- Antenna / Signal Emitter -->
  <line x1="100" y1="45" x2="100" y2="28" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="100" cy="24" r="5" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="100" cy="24" r="2" fill="#ffffff"/>

  <!-- Ear Audio Receivers (Siren Accents) -->
  <rect x="42" y="90" width="9" height="26" rx="4" fill="#ef4444" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="149" y="90" width="9" height="26" rx="4" fill="#3b82f6" stroke="#93c5fd" stroke-width="1.5"/>

  <!-- Robot Face Visor (Cyber Display) -->
  <rect x="62" y="82" width="76" height="42" rx="14" fill="#030712" stroke="#38bdf8" stroke-width="2"/>

  <!-- Friendly Glowing Eyes (Happy Curved Eyes) -->
  <path d="M 74 102 Q 83 93 92 102" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 108 102 Q 117 93 126 102" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="83" cy="99" r="1.5" fill="#ffffff"/>
  <circle cx="117" cy="99" r="1.5" fill="#ffffff"/>

  <!-- Cheek Blushes (Friendly AI Vibe) -->
  <circle cx="72" cy="114" r="3" fill="#f43f5e" opacity="0.8"/>
  <circle cx="128" cy="114" r="3" fill="#f43f5e" opacity="0.8"/>

  <!-- Robot Mouth LED Line -->
  <line x1="94" y1="116" x2="106" y2="116" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Chest Plate / Badge -->
  <path d="M 75 152 L 125 152 L 118 180 L 82 180 Z" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <rect x="88" y="158" width="24" height="8" rx="2" fill="#fbbf24"/>
  <text x="100" y="164.5" font-size="5.5" font-family="sans-serif" font-weight="900" fill="#0f172a" text-anchor="middle">SIGAP</text>

  <!-- Speed / Safety Lines -->
  <path d="M 28 95 L 36 95" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M 24 105 L 34 105" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M 164 95 L 172 95" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M 166 105 L 176 105" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>
